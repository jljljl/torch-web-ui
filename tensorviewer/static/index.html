<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Torch Web UI</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="header">
            <h1>Torch Web UI</h1>
        </div>

        <div class="panel">
            <h3>Tensor</h3>
            <select id="tensorSelect"></select>
        </div>

        <div class="panel">
            <h3>Mode</h3>
            <select id="modeSelect">
                <option value="single_bc">1 B × 1 C</option>
                <option value="batch_all_channels">Batch / all channels</option>
                <option value="channel_all_batches">Channel / all batches</option>
                <option value="grid_bc">Grid B × C</option>
            </select>
        </div>

        <div class="panel">

            <div class="slider-row">
                <label>Batch</label>
                <span id="batchValue">0</span>
            </div>

            <input id="batchSlider" type="range" min="0" max="0" value="0">

            <div class="slider-row">
                <label>Channel</label>
                <span id="channelValue">0</span>
            </div>

            <input id="channelSlider" type="range" min="0" max="0" value="0">

        </div>

        <div class="panel">

            <h3>Axes</h3>

            <input id="axesInput" value="B,C,H,W">

        </div>

        <div class="panel">

            <label class="checkbox">
                <input id="separateNorm" type="checkbox">
                Separate normalization
            </label>

        </div>


        <div class="panel">

            <h3>Console</h3>

            <pre id="console"></pre>

        </div>


        <div class="panel">

            <h3>Parameters</h3>

            <div id="params-table"></div>

        </div>

    </aside>


    <main class="viewer">
        <canvas id="tensorCanvas"></canvas>
        <img id="tensorImage">
    </main>

</div>


<script src="/app.js"></script>
<script src="/params.js"></script>
<script src="/renderer.js"></script>
</body>
</html>
